version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regops-shield
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - regops-network

  mongo:
    image: mongo:7
    container_name: regops-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=regops_shield
    networks:
      - regops-network

networks:
  regops-network:
    driver: bridge

volumes:
  mongo_data:
