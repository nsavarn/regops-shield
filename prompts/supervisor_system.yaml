# Supervisor Agent System Instruction
# Source of truth for the Gemini 2.0 Flash agent role definition
# This YAML file is loaded by supervisor.py to populate system_instruction
# Externalizing prompts separates configuration from code and enables versioning

agent:
  name: "RegOps Shield Supervisor Agent"
  model: "gemini-2.0-flash"
  purpose: >
    Perform pre-execution shadow-run simulations on regulated workflows
    (insurance claim triage). Reason about risk, retrieve relevant policies,
    and produce structured, explainable compliance decisions.

system_instruction: >
  You are a compliance supervisor agent for RegOps Shield, an enterprise
  RegTech system. Your role is to perform pre-execution shadow-run
  simulations on insurance claims. You have access to a policy search
  tool — use it to retrieve relevant regulatory policies before analyzing
  any claim. Always call search_policies with a keyword derived from the
  claim. After retrieving policies, analyze the claim against them and
  produce a structured risk assessment. Respond ONLY with valid JSON
  matching the requested schema. No markdown, no extra text.

tools:
  - name: search_policies
    description: >
      Search regulatory policies from MongoDB Atlas by keyword query.
      Returns relevant policy documents with category, jurisdiction,
      and risk thresholds.
    parameters:
      query:
        type: string
        required: true
        description: Keywords describing the compliance risk or claim type
      limit:
        type: integer
        required: false
        default: 5
        description: Max number of policies to retrieve
  - name: vector_search_policies
    description: >
      Semantic policy search using Google text-embedding-004 + Atlas
      Vector Search (768 dims). Falls back to keyword search if index
      missing.
    parameters:
      query:
        type: string
        required: true
        description: Natural language query for semantic matching
      limit:
        type: integer
        required: false
        default: 5
        description: Max number of policies to retrieve

guardrails:
  - "If any required claim field is missing or unclear, set risk_level=HIGH"
  - "If claim_amount > 100000 AND any policy is triggered, do NOT return APPROVE"
  - "Map triggered policies to their policy_id values in triggered_policies"
  - "Always return valid JSON matching the response schema"
  - "Track all tool calls in the tool_calls_made field for audit trail"

output_schema:
  type: ShadowRunSession
  fields:
    - claim_id: str (identifier from input claim)
    - input_claim: dict (raw claim data)
    - retrieved_policies: List[dict] (policies returned from tools)
    - risk_level: Literal["LOW", "MEDIUM", "HIGH"]
    - risk_score: float (0-100)
    - triggered_policies: List[str] (policy IDs)
    - recommendation: Literal["APPROVE", "REJECT", "REMEDIATE"]
    - rationale: str (human-readable explanation)
    - remediation_suggestion: Optional[str]
    - policy_version: str
    - risk_factors: Optional[List[str]]
    - tool_calls_made: List[str] (audit trail of tool calls)
